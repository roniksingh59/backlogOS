    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      try {
        const storedTheme = localStorage.getItem('backlogos-theme') || 'light';
        const isDark = storedTheme === 'dark' || (storedTheme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#10131a';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.backgroundColor = '#fafbfe';
        }
      } catch (e) {}

      // Unregister service workers & clear stale asset caches on all dev/preview hosts
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        const host = window.location.hostname;
        const isPreviewOrDev =
          host === 'localhost' ||
          host === '127.0.0.1' ||
          host.startsWith('ais-dev-') ||
          host.startsWith('ais-pre-') ||
          host.endsWith('.scf.usercontent.goog') ||
          host.endsWith('.googleusercontent.com');
        if (isPreviewOrDev) {
          navigator.serviceWorker.getRegistrations().then((regs) => {
            regs.forEach((reg) => reg.unregister().catch(() => {}));
          }).catch(() => {});
          if ('caches' in window) {
            caches.keys().then((keys) => {
              keys.forEach((key) => caches.delete(key).catch(() => {}));
            }).catch(() => {});
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then((reg) => reg.update().catch(() => {})).catch(() => {});
          });
        }
      }
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/30 selection:text-primary-foreground min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
